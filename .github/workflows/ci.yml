# CI for ReferralFlow (synthetic data only; APP_ENV=local so the production guard does not trip).
name: ci
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'sodium, gd, pdo_sqlite, mbstring, pcov', coverage: pcov }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: composer install --no-interaction --prefer-dist
        env: { APP_ENV: local }
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: ./vendor/bin/pest --coverage --min=0
      - run: composer audit
      - run: npm audit
  e2e:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'sodium, gd, pdo_sqlite, mbstring' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: composer install --no-interaction --prefer-dist --no-dev
        env: { APP_ENV: local }
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium && node run.mjs && node a11y.mjs && node keyboard.mjs && node print-perf.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots }
