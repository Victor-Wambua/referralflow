# ReferralFlow staging stack: nginx -> php-fpm, PostgreSQL, scheduler.
# NOT run on the development machine (no Docker/Postgres there). Synthetic data only.
# Copy .env.example to .env and set APP_KEY, DB_PASSWORD, APP_URL before use. Put TLS in front (docs/DEPLOYMENT.md).
services:
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: staging
      REFERRALFLOW_MODE: staging
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: referralflow
      DB_USERNAME: referralflow
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private-storage:/var/www/html/storage/app/private
      - public-assets:/var/www/html/public
  web:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["4470:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public-assets:/var/www/html/public:ro
  scheduler:
    build: .
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: staging
      REFERRALFLOW_MODE: staging
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: referralflow
      DB_USERNAME: referralflow
    depends_on: [db]
    volumes:
      - private-storage:/var/www/html/storage/app/private
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: referralflow
      POSTGRES_USER: referralflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referralflow"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  private-storage:
  public-assets:
