# Staging nginx. Terminate TLS in front of this (load balancer or a TLS server block) and keep HSTS on.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 6m;          # uploads are limited to 5 MB per file by the application

    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ /\.(?!well-known) { deny all; }
    # patient documents are never served from disk by nginx; they only leave through the authorised controller
}
